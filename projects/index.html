<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects Directory</title>
	    <style>
        body {
            background-color: #f4dfce;			/* Arkaplan rengi */
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 3em;						/* Başlık büyüklüğü */
            text-align: center;
            margin-top: 50px;
        }
        hr {
            width: 50%;
            margin: 50px auto;
            border: 0;
            border-top: 3px solid #cb610c;
        }
        ul {
            list-style-type: none;				/* Noktaları kaldırma */
            padding: 0;
        }
        li {
            margin: 50px 0;
            text-align: center;
        }
        a {
            text-decoration: none;				/* Alt çizgiyi kaldırma */
            font-size: 2em;						/* Link büyüklüğü */
            color: #0073e6;						/* Link rengi */
        }
        a:hover {
            color: #cb610c;						/* Linkin üzerine gelindiğinde renk değişimi */
        }
    </style>
    <script>
        async function fetchDirectoryContents() {
            const username = 'aliosmanatik'; // GitHub kullanıcı adınızı buraya yazın
            const repo = 'aliosmanatik.com.tr'; // GitHub depo adınızı buraya yazın
            const directory = 'projects'; // Dizin yolunu buraya yazın
            const url = `https://api.github.com/repos/${username}/${repo}/contents/${directory}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                const listContainer = document.getElementById('file-list');
                data.forEach(item => {
                    if (item.type === 'file' && item.name !== 'index.html') {
                        const listItem = document.createElement('li');
                        const link = document.createElement('a');
                        // Doğru URL'yi oluşturun
                        link.href = `https://${username}.github.io/${repo}/${directory}/${item.name}`;
                        link.textContent = item.name;
                        listItem.appendChild(link);
                        listContainer.appendChild(listItem);
                    }
                });
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDirectoryContents);
    </script>
</head>
<body>
    <h1>Projects Directory</h1>
	<hr>
    <ul id="file-list">
        <!-- Dosya listesi buraya eklenecek -->
    </ul>
</body>
</html>
